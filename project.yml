name: Gitter
options:
  bundleIdPrefix: dev.penzin
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
packages:
  GitCore:
    path: GitCore
targets:
  Gitter:
    type: application
    platform: macOS
    sources:
      - path: Gitter
    dependencies:
      - package: GitCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # The commit a packaged build was made from (scripts/package.sh passes it); empty in a
        # plain Xcode build, whose About panel then shows the version and build only.
        GITTER_COMMIT: ""
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Gitter/Info.plist
      properties:
        CFBundleName: Gitter
        CFBundleDisplayName: Gitter
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GitterCommit: "$(GITTER_COMMIT)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: public.app-category.developer-tools
    entitlements:
      path: Gitter/Gitter.entitlements
      properties:
        com.apple.security.app-sandbox: false
  GitterTests:
    type: bundle.unit-test
    platform: macOS
    sources: [GitterTests]
    dependencies:
      - target: Gitter
      - package: GitCore
      # The test helpers shared with GitCoreTests (E3 Task 2). On this test target only: the app
      # never links it.
      - package: GitCore
        product: GitCoreTestSupport
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Gitter:
    build:
      targets:
        Gitter: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: GitCore/GitCoreTests
        - GitterTests
